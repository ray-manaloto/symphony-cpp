name: OpenAI OpenAPI C++ generation

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: openai-openapi-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Report upstream movement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          locked=f9400172ebe08522ab228b771d885e3bd5456e42
          current=$(gh api repos/openai/openai-openapi/commits/main --jq .sha)
          if [ "$current" != "$locked" ]; then
            # shellcheck disable=SC2016  # The printf format is intentionally literal.
            printf '### OpenAI OpenAPI update available\n\nLocked: `%s`  \nCurrent: `%s`\n' "$locked" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate pinned C++ reference client
        run: ./scripts/generate-openai-api.sh
      - name: Upload generated reference client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openai-api-cpp-${{ github.sha }}
          path: .build/generated/openai-api
          if-no-files-found: error
          retention-days: 14

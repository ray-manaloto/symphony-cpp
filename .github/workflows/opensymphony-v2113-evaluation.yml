name: OpenSymphony v2.11.3 stock evaluation image

on:
  push:
    branches:
      - codex/opensymphony-v2113-gha
    paths:
      - .github/workflows/opensymphony-v2113-evaluation.yml
      - containers/OpenSymphony-v2113-evaluation.Containerfile
      - containers/opensymphony-v2113-evaluation.bake.hcl
      - docs/dependency-decisions.md
      - docs/opensymphony-v2113-evaluation-workflow.md
      - docs/upstream-lock.md
      - ops/opensymphony/evaluation/v2.11.3/input-manifest-v1.json
      - scripts/build-opensymphony-v2113-evaluation.sh
      - scripts/check-push-route.mjs
      - scripts/opensymphony-v2113-build-input-id.sh
      - scripts/run-opensymphony-v2113-github-actions.sh
      - scripts/test-opensymphony-v2113-build.sh
      - scripts/test-opensymphony-v2113-github-actions.mjs
      - scripts/test-opensymphony-v2113-upstream.sh
      - scripts/test-push-route.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensymphony-v2113-ticket47-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-stock-evaluation:
    name: Native amd64 stock build and transfer packet
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DOCKER_CONFIG: /tmp/symphony-osv2113-019fc0ca-ticket47-docker-config
      DOCKER_HOST: unix:///var/run/docker.sock
      OPENSYMPHONY_ARTIFACT_DIR: /tmp/opensymphony-v2113-ticket47-artifact
      OPENSYMPHONY_BUILDER: symphony-osv2113-019fc0ca-ticket47-builder
      OPENSYMPHONY_EXECUTION_PROFILE: github-actions-native-amd64
      OPENSYMPHONY_IMAGE: symphony-opensymphony:osv2113-019fc0ca-ticket47
    steps:
      - name: Check out the exact workflow commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prove portable build-input identity before Docker
        shell: bash
        run: |
          set -euo pipefail
          build_input_sha256="$(scripts/opensymphony-v2113-build-input-id.sh)"
          [[ "${build_input_sha256}" =~ ^[0-9a-f]{64}$ ]]
          printf 'portable build-input SHA-256: %s\n' "${build_input_sha256}"

      - name: Verify native x64 runner and private Docker boundary
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = amd64
          test "$(uname -m)" = x86_64
          test ! -e "${DOCKER_CONFIG}"
          install -d -m 0700 "${DOCKER_CONFIG}"
          test "$(stat -c '%a' "${DOCKER_CONFIG}")" = 700
          test -z "$(find "${DOCKER_CONFIG}" -mindepth 1 -print -quit)"

      - name: Reclaim ephemeral runner disk
        run: |
          set -euo pipefail
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          df -i /

      - name: Prove fresh runner Docker collision boundary
        run: scripts/run-opensymphony-v2113-github-actions.sh preflight

      - name: Create the exact native BuildKit builder
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          name: symphony-osv2113-019fc0ca-ticket47-builder
          driver: docker-container
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit@sha256:2caaaf9bc673a82d5b0a87824f8375e6b2b36b55001dad611230516c724e9fba
          buildkitd-flags: --debug
          cleanup: true

      - name: Build, test, export, and clean the stock image
        env:
          OPENSYMPHONY_ARTIFACT_NAME: opensymphony-v2113-ticket47-${{ github.sha }}
          OPENSYMPHONY_ARTIFACT_ACTION: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
          OPENSYMPHONY_BUILDX_ACTION: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
          OPENSYMPHONY_GITHUB_EVENT_NAME: ${{ github.event_name }}
          OPENSYMPHONY_GITHUB_REF: ${{ github.ref }}
          OPENSYMPHONY_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OPENSYMPHONY_GITHUB_RUN_ID: ${{ github.run_id }}
          OPENSYMPHONY_GITHUB_SHA: ${{ github.sha }}
          OPENSYMPHONY_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: scripts/run-opensymphony-v2113-github-actions.sh execute

      - name: Upload the temporary #47 to #48 transfer packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opensymphony-v2113-ticket47-${{ github.sha }}
          path: ${{ env.OPENSYMPHONY_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Prove runner-local cleanup on every exit
        if: ${{ always() }}
        run: scripts/run-opensymphony-v2113-github-actions.sh cleanup-only

name: C++26 toolchain base images

on:
  workflow_dispatch:
    inputs:
      lineage:
        description: Toolchain lineage to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - gcc16
          - clang-p2996
          - llvm-analysis
      architecture:
        description: Native architecture to validate
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
      publish_images:
        description: Reserved for the future two-architecture publication ceremony
        required: false
        default: false
        type: boolean
      seed_clang_artifact_package:
        description: Explicitly publish the missing pinned clang-p2996 artifact package
        required: false
        default: false
        type: boolean
      seed_gcc_artifact_package:
        description: Explicitly publish the missing pinned GCC 16.1 artifact package
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: compiler-matrix-${{ github.ref }}-${{ inputs.lineage }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate dispatch boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Hold publication during native ARM64 qualification
        if: ${{ inputs.publish_images }}
        run: |
          echo "publication is disabled during native ARM64 qualification" >&2
          exit 2
      - name: Restrict the first ARM64 phase to GCC
        if: ${{ inputs.architecture == 'arm64' && inputs.lineage != 'gcc16' }}
        run: |
          echo "the first ARM64 phase validates only lineage=gcc16" >&2
          exit 2
      - name: Restrict clang artifact publication to its exact lane
        if: ${{ inputs.seed_clang_artifact_package && (inputs.lineage != 'clang-p2996' || inputs.architecture != 'amd64') }}
        run: |
          echo "clang artifact publication requires lineage=clang-p2996 and architecture=amd64" >&2
          exit 2
      - name: Restrict clang artifact publication to reviewed branches
        if: ${{ inputs.seed_clang_artifact_package && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/codex/implementation' }}
        run: |
          echo "clang artifact publication requires main or codex/implementation" >&2
          exit 2
      - name: Restrict GCC artifact publication to its exact lane
        if: ${{ inputs.seed_gcc_artifact_package && inputs.lineage != 'gcc16' }}
        run: |
          echo "GCC artifact publication requires lineage=gcc16" >&2
          exit 2
      - name: Restrict GCC artifact publication to reviewed branches
        if: ${{ inputs.seed_gcc_artifact_package && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/codex/implementation' }}
        run: |
          echo "GCC artifact publication requires main or codex/implementation" >&2
          exit 2

  gcc16-artifact:
    name: Resolve or publish GCC 16.1 artifact
    if: ${{ inputs.lineage == 'all' || inputs.lineage == 'gcc16' }}
    needs: validate-inputs
    concurrency:
      group: gcc16-artifact-${{ inputs.architecture }}-6b1431c2581c93d174792a530acd054c06979d9185117aefca7f03a46830f51d
      cancel-in-progress: false
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    outputs:
      ref: ${{ steps.gcc-artifact.outputs.ref }}
      digest: ${{ steps.gcc-artifact.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      TOOLCHAIN_ARCH: ${{ inputs.architecture }}
      TOOLCHAIN_PLATFORM: linux/${{ inputs.architecture }}
      GCC16_ARTIFACT_REF: ghcr.io/${{ github.repository_owner }}/symphony-toolchain-gcc:16.1.0-${{ inputs.architecture }}-6b1431c2581c93d174792a530acd054c06979d9185117aefca7f03a46830f51d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native runner architecture and capacity
        run: |
          test "$(dpkg --print-architecture)" = "${TOOLCHAIN_ARCH}"
          case "${TOOLCHAIN_ARCH}" in
            amd64) expected_machine=x86_64 ;;
            arm64) expected_machine=aarch64 ;;
            *) echo "unsupported toolchain architecture: ${TOOLCHAIN_ARCH}" >&2; exit 64 ;;
          esac
          test "$(uname -m)" = "${expected_machine}"
          df -h /
          df -i /
          docker system df
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        id: buildx
        with:
          version: v0.35.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe immutable GCC 16.1 package
        id: gcc-artifact-probe
        env:
          ARTIFACT_REF: ${{ env.GCC16_ARTIFACT_REF }}
        run: |
          set -euo pipefail
          error_log="$(mktemp)"
          if digest="$(
            docker buildx imagetools inspect \
              "${ARTIFACT_REF}" \
              --format '{{.Manifest.Digest}}' \
              2>"${error_log}"
          )"; then
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid GCC 16.1 package digest: ${digest}" >&2
              exit 1
            fi
            {
              echo "hit=true"
              echo "digest=${digest}"
            } >>"${GITHUB_OUTPUT}"
          elif grep -qiE 'manifest unknown|not found|no such manifest' "${error_log}"; then
            echo "hit=false" >>"${GITHUB_OUTPUT}"
          else
            cat "${error_log}" >&2
            exit 1
          fi
      - name: Require explicit GCC package seed on a miss
        if: ${{ steps.gcc-artifact-probe.outputs.hit != 'true' && !inputs.seed_gcc_artifact_package }}
        run: |
          echo "Immutable GCC 16.1 package is required for validation; dispatch this exact lane once with seed_gcc_artifact_package=true" >&2
          exit 2
      - name: Publish isolated GCC 16.1 package before source validation
        id: gcc-artifact-publish
        if: ${{ steps.gcc-artifact-probe.outputs.hit != 'true' && inputs.seed_gcc_artifact_package }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: containers/Containerfile
          target: gcc16-artifact
          platforms: ${{ env.TOOLCHAIN_PLATFORM }}
          push: true
          tags: ${{ env.GCC16_ARTIFACT_REF }}
          provenance: mode=max
          sbom: true
          load: false
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha,scope=symphony-gcc16-${{ inputs.architecture }}-min-v3
      - name: Select captured GCC 16.1 package digest
        id: gcc-artifact
        env:
          ARTIFACT_REF: ${{ env.GCC16_ARTIFACT_REF }}
          CACHE_HIT: ${{ steps.gcc-artifact-probe.outputs.hit }}
          PROBED_DIGEST: ${{ steps.gcc-artifact-probe.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.gcc-artifact-publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" == true ]]; then
            digest="${PROBED_DIGEST}"
          else
            digest="${PUBLISHED_DIGEST}"
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid GCC 16.1 package digest: ${digest}" >&2
            exit 1
          fi
          {
            echo "ref=${ARTIFACT_REF}"
            echo "digest=${digest}"
          } >>"${GITHUB_OUTPUT}"

  gcc16:
    name: GCC 16.1 ${{ inputs.architecture }} base and source contracts
    if: ${{ inputs.lineage == 'all' || inputs.lineage == 'gcc16' }}
    needs:
      - validate-inputs
      - gcc16-artifact
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      TOOLCHAIN_ARCH: ${{ inputs.architecture }}
      TOOLCHAIN_PLATFORM: linux/${{ inputs.architecture }}
      CCACHE_DANCE_DIR: ${{ github.workspace }}/.build/toolchain-cache/ccache/gcc/${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native runner architecture and capacity
        run: |
          test "$(dpkg --print-architecture)" = "${TOOLCHAIN_ARCH}"
          case "${TOOLCHAIN_ARCH}" in
            amd64) expected_machine=x86_64 ;;
            arm64) expected_machine=aarch64 ;;
            *) echo "unsupported toolchain architecture: ${TOOLCHAIN_ARCH}" >&2; exit 64 ;;
          esac
          test "$(uname -m)" = "${expected_machine}"
          df -h /
          df -i /
          docker system df
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        id: buildx
        with:
          version: v0.35.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore bounded GCC compiler cache
        id: gcc-ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CCACHE_DANCE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-gcc16-ccache-v1-${{ hashFiles('containers/Containerfile', 'CMakePresets.json', 'CMakeLists.txt', 'cmake/**', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gcc16-ccache-v1-${{ hashFiles('containers/Containerfile', 'CMakePresets.json', 'CMakeLists.txt', 'cmake/**', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-gcc16-ccache-v1-
      - name: Bridge GCC compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "${{ env.CCACHE_DANCE_DIR }}": {
                "target": "/var/cache/ccache",
                "id": "gcc-${{ inputs.architecture }}-ccache",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.gcc-ccache.outputs.cache-hit }}
          utility-image: ghcr.io/containerd/busybox@sha256:52f73a0a43a16cf37cd0720c90887ce972fe60ee06a687ee71fb93a7ca601df7
      - name: Build and validate GCC toolchain without loading it
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: containers/Containerfile
          target: symphony-gcc-validation
          platforms: ${{ env.TOOLCHAIN_PLATFORM }}
          outputs: type=cacheonly
          load: false
          push: false
          builder: ${{ steps.buildx.outputs.name }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          build-contexts: |
            gcc16-artifact=docker-image://${{ needs.gcc16-artifact.outputs.ref }}@${{ needs.gcc16-artifact.outputs.digest }}
  clang-p2996-artifact:
    name: Resolve or publish clang-p2996 artifact
    if: ${{ inputs.lineage == 'all' || inputs.lineage == 'clang-p2996' }}
    needs: validate-inputs
    concurrency:
      group: clang-p2996-artifact-7220baffd57ea5b0f8cf59bee494dd5b7cc2b748-amd64-77b98dd8970c509c9492ad30e19a4ce6dbb6474fc14b167b9aed6094fd9bc276
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      ref: ${{ steps.clang-artifact.outputs.ref }}
      digest: ${{ steps.clang-artifact.outputs.digest }}
      index_digest: ${{ steps.clang-artifact.outputs.index_digest }}
    permissions:
      contents: read
      packages: write
    env:
      CLANG_P2996_ARTIFACT_REF: ghcr.io/${{ github.repository_owner }}/symphony-toolchain-clang-p2996:7220baffd57ea5b0f8cf59bee494dd5b7cc2b748-amd64-77b98dd8970c509c9492ad30e19a4ce6dbb6474fc14b167b9aed6094fd9bc276
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        id: buildx
        with:
          version: v0.35.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe immutable clang-p2996 package
        id: clang-artifact-probe
        env:
          ARTIFACT_REF: ${{ env.CLANG_P2996_ARTIFACT_REF }}
        run: |
          set -euo pipefail
          error_log="$(mktemp)"
          if digest="$(
            docker buildx imagetools inspect \
              "${ARTIFACT_REF}" \
              --format '{{.Manifest.Digest}}' \
              2>"${error_log}"
          )"; then
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid clang-p2996 package digest: ${digest}" >&2
              exit 1
            fi
            {
              echo "hit=true"
              echo "index_digest=${digest}"
            } >>"${GITHUB_OUTPUT}"
          elif grep -qiE 'manifest unknown|not found|no such manifest' "${error_log}"; then
            echo "hit=false" >>"${GITHUB_OUTPUT}"
          else
            cat "${error_log}" >&2
            exit 1
          fi
      - name: Require explicit package seed on a miss
        if: ${{ steps.clang-artifact-probe.outputs.hit != 'true' && !inputs.seed_clang_artifact_package }}
        run: |
          echo "Immutable clang-p2996 package is required for validation; dispatch this exact lane once with seed_clang_artifact_package=true" >&2
          exit 2
      - name: Publish isolated clang-p2996 package before source validation
        id: clang-artifact-publish
        if: ${{ steps.clang-artifact-probe.outputs.hit != 'true' && inputs.seed_clang_artifact_package }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: containers/Containerfile
          target: clang-p2996-artifact
          platforms: linux/amd64
          push: true
          tags: ${{ env.CLANG_P2996_ARTIFACT_REF }}
          provenance: mode=max
          sbom: true
          load: false
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha,scope=symphony-clang-p2996-artifact-7220baffd57ea5b0f8cf59bee494dd5b7cc2b748-v1
      - name: Select captured clang-p2996 package digest
        id: clang-artifact
        env:
          ARTIFACT_REF: ${{ env.CLANG_P2996_ARTIFACT_REF }}
          CACHE_HIT: ${{ steps.clang-artifact-probe.outputs.hit }}
          PROBED_INDEX_DIGEST: ${{ steps.clang-artifact-probe.outputs.index_digest }}
          PUBLISHED_INDEX_DIGEST: ${{ steps.clang-artifact-publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" == true ]]; then
            index_digest="${PROBED_INDEX_DIGEST}"
          else
            index_digest="${PUBLISHED_INDEX_DIGEST}"
          fi
          if [[ ! "${index_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid clang-p2996 package index digest: ${index_digest}" >&2
            exit 1
          fi

          index_json="$(
            docker buildx imagetools inspect \
              "${ARTIFACT_REF}@${index_digest}" \
              --raw
          )"
          digest="$(
            jq -er '
              if .mediaType != "application/vnd.oci.image.index.v1+json" then
                error("clang-p2996 package must be an OCI image index")
              else
                [
                  .manifests[]
                  | select(
                      .mediaType == "application/vnd.oci.image.manifest.v1+json"
                      and .platform.os == "linux"
                      and .platform.architecture == "amd64"
                    )
                ]
                | if length == 1 then
                    .[0].digest
                  else
                    error("clang-p2996 package must contain exactly one linux/amd64 image manifest")
                  end
              end
            ' <<<"${index_json}"
          )"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid clang-p2996 linux/amd64 manifest digest: ${digest}" >&2
            exit 1
          fi
          child_media_type="$(
            docker buildx imagetools inspect \
              "${ARTIFACT_REF}@${digest}" \
              --raw |
              jq -er '.mediaType'
          )"
          if [[ "${child_media_type}" != "application/vnd.oci.image.manifest.v1+json" ]]; then
            echo "clang-p2996 platform digest is not an OCI image manifest" >&2
            exit 1
          fi
          {
            echo "ref=${ARTIFACT_REF}"
            echo "digest=${digest}"
            echo "index_digest=${index_digest}"
          } >>"${GITHUB_OUTPUT}"

  clang-p2996:
    name: clang-p2996 base and differential contract
    if: ${{ inputs.lineage == 'all' || inputs.lineage == 'clang-p2996' }}
    needs:
      - validate-inputs
      - clang-p2996-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      CCACHE_DANCE_DIR: ${{ github.workspace }}/.build/toolchain-cache/ccache/clang-p2996/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        id: buildx
        with:
          version: v0.35.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore bounded clang-p2996 compiler cache
        id: clang-ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CCACHE_DANCE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-clang-p2996-ccache-v2-${{ needs.clang-p2996-artifact.outputs.digest }}-${{ hashFiles('containers/Containerfile', 'containers/validation/clang-p2996.Containerfile', 'CMakePresets.json', 'CMakeLists.txt', 'cmake/**', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-clang-p2996-ccache-v2-${{ needs.clang-p2996-artifact.outputs.digest }}-${{ hashFiles('containers/Containerfile', 'containers/validation/clang-p2996.Containerfile', 'CMakePresets.json', 'CMakeLists.txt', 'cmake/**', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-clang-p2996-ccache-v2-${{ needs.clang-p2996-artifact.outputs.digest }}-
      - name: Bridge clang-p2996 compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "${{ env.CCACHE_DANCE_DIR }}": {
                "target": "/var/cache/ccache",
                "id": "clang-p2996-ccache",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.clang-ccache.outputs.cache-hit }}
          utility-image: ghcr.io/containerd/busybox@sha256:52f73a0a43a16cf37cd0720c90887ce972fe60ee06a687ee71fb93a7ca601df7
      - name: Build and validate clang-p2996 without loading it
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          CLANG_P2996_ARTIFACT_CONTEXT: docker-image://${{ needs.clang-p2996-artifact.outputs.ref }}@${{ needs.clang-p2996-artifact.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${CLANG_P2996_ARTIFACT_CONTEXT}" =~ ^docker-image://[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "clang-p2996 validation requires an exact digest-pinned artifact context" >&2
            exit 2
          fi
          docker buildx bake \
            --builder "${BUILDX_BUILDER}" \
            --file containers/p2996-separated.bake.hcl \
            --progress=plain \
            clang-p2996-validation
  llvm-analysis:
    name: LLVM 22.1.8 analysis base and source-quality contract
    if: ${{ inputs.lineage == 'all' || inputs.lineage == 'llvm-analysis' }}
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DANCE_DIR: ${{ github.workspace }}/.build/toolchain-cache/ccache/analysis/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate LLVM version-output contract
        run: ./scripts/test-analysis-toolchain-contract.sh
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        id: buildx
        with:
          version: v0.35.0
      - name: Persist stable LLVM analysis base before source validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: containers/Containerfile
          target: symphony-analysis
          platforms: linux/amd64
          outputs: type=cacheonly
          load: false
          push: false
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha,scope=symphony-llvm-analysis-min-v2
          cache-to: type=gha,mode=min,scope=symphony-llvm-analysis-min-v2,timeout=30m,ignore-error=true
      - name: Restore bounded analysis compiler cache
        id: analysis-ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CCACHE_DANCE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-analysis-ccache-v1-${{ hashFiles('containers/Containerfile', 'CMakePresets.json', 'CMakeLists.txt', 'cmake/**', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-analysis-ccache-v1-${{ hashFiles('containers/Containerfile', 'CMakePresets.json', 'CMakeLists.txt', 'cmake/**', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-analysis-ccache-v1-
      - name: Bridge analysis compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "${{ env.CCACHE_DANCE_DIR }}": {

name: C++26 compiler matrix

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish tested development images to GHCR
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: compiler-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gcc16:
    name: GCC 16.1 reflection and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Sign in to GHCR
        if: ${{ inputs.publish_images }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned GCC development image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: containers/Containerfile
          target: symphony-dev
          platforms: linux/amd64
          load: true
          push: false
          tags: symphony-dev:ci
          cache-from: type=gha,scope=symphony-gcc16
          cache-to: type=gha,mode=max,scope=symphony-gcc16
      - name: Tag local GCC devcontainer image
        run: |
          test "$(docker image inspect symphony-dev:ci --format '{{len .Config.Entrypoint}}')" = "0"
          docker run --rm symphony-dev:ci bash -lc 'test "$(g++ -dumpfullversion)" = "16.1.0"'
          docker tag symphony-dev:ci ghcr.io/ray-manaloto/symphony-dev:edge
      - name: GCC reflection suite
        uses: devcontainers/ci@b63b30de439b47a52267f241112c5b453b673db5
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: >-
            test "$(g++ -dumpfullversion)" = "16.1.0"
            && cmake --preset gcc-debug
            && cmake --build --preset gcc-debug
            && ctest --preset gcc-debug
            && cmake --preset gcc-sanitizers
            && cmake --build --preset gcc-sanitizers
            && ctest --preset gcc-sanitizers
      - name: Publish tested GCC development image
        if: ${{ inputs.publish_images }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/symphony-dev"
          docker tag symphony-dev:ci "${image}:${GITHUB_SHA}"
          docker tag symphony-dev:ci "${image}:edge"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:edge"

  clang-p2996:
    name: clang-p2996 differential reflection
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Sign in to GHCR
        if: ${{ inputs.publish_images }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned Clang differential image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: containers/Containerfile
          target: symphony-ci-clang
          platforms: linux/amd64
          load: true
          push: false
          tags: symphony-ci-clang:ci
          cache-from: type=gha,scope=symphony-clang-p2996
          cache-to: type=gha,mode=max,scope=symphony-clang-p2996
      - name: Tag local Clang devcontainer image
        run: |
          test "$(docker image inspect symphony-ci-clang:ci --format '{{len .Config.Entrypoint}}')" = "0"
          docker run --rm symphony-ci-clang:ci bash -lc 'test -x /opt/clang-p2996/bin/clang++'
          docker tag symphony-ci-clang:ci ghcr.io/ray-manaloto/symphony-ci-clang:edge
      - name: Clang differential reflection suite
        uses: devcontainers/ci@b63b30de439b47a52267f241112c5b453b673db5
        with:
          configFile: .devcontainer/clang-p2996/devcontainer.json
          push: never
          runCmd: >-
            test -x /opt/clang-p2996/bin/clang++
            && cmake --preset clang-reflection
            && cmake --build --preset clang-reflection
            && ctest --preset clang-reflection
      - name: Publish tested Clang differential image
        if: ${{ inputs.publish_images }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/symphony-ci-clang"
          docker tag symphony-ci-clang:ci "${image}:${GITHUB_SHA}"
          docker tag symphony-ci-clang:ci "${image}:edge"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:edge"

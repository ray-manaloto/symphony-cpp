name: Source CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc16:
    name: GCC 16.1 source and reflection tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: gcc:16.1@sha256:4eb18b10b4b6464ba0409fa9d6d0a3ed81c5246e086ac7b7bfe2fa5c8b01e4cb
    steps:
      - name: Install build frontend
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates ccache cmake curl git ninja-build nodejs tar unzip zip
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce dependency-first policy
        run: node scripts/check-dependency-policy.mjs
      - name: Bootstrap pinned vcpkg
        run: ./scripts/bootstrap-vcpkg.sh
      - name: Configure
        run: cmake --preset gcc-debug
      - name: Build
        run: cmake --build --preset gcc-debug --parallel 4
      - name: Test
        run: ctest --preset gcc-debug
      - name: Configure ASan and UBSan
        run: cmake --preset gcc-sanitizers
      - name: Build ASan and UBSan
        run: cmake --build --preset gcc-sanitizers --parallel 4
      - name: Test ASan and UBSan
        run: ctest --preset gcc-sanitizers
      - name: Configure TSan
        run: cmake --preset gcc-tsan
      - name: Build TSan
        run: cmake --build --preset gcc-tsan --parallel 4
      - name: Test TSan
        run: ctest --preset gcc-tsan

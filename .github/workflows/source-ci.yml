name: Source CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Workflow, policy, and container preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          version: 2026.7.12
          sha256: dad54e0b843908324282b8673f9c0ebc3a4da0c49ad2da309a49bfbc918ba180
          cache_key_prefix: symphony-lint-v1
      - name: Run exact local preflight
        run: ./scripts/check-local-preflight.sh quick

  gcc16:
    name: GCC 16.1 source and reflection tests
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.build/cache/ccache
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.build/cache/vcpkg/archives
    container:
      image: gcc:16.1@sha256:4eb18b10b4b6464ba0409fa9d6d0a3ed81c5246e086ac7b7bfe2fa5c8b01e4cb
    steps:
      - name: Install build frontend
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates ccache cmake curl git jq ninja-build nodejs tar unzip zip zstd
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned CMake 4.4.0
        run: ./scripts/install-cmake.sh
      - name: Restore pinned vcpkg binary cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: source-vcpkg-gcc16-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**', 'scripts/bootstrap-vcpkg.sh') }}
          restore-keys: source-vcpkg-gcc16-v1-
      - name: Restore GCC compiler cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ env.CCACHE_DIR }}
          key: source-ccache-gcc16-v1-${{ github.sha }}
          restore-keys: source-ccache-gcc16-v1-
      - name: Bound compiler cache
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          ccache --max-size=750M
          ccache --zero-stats
      - name: Enforce dependency-first policy
        run: node scripts/check-dependency-policy.mjs
      - name: Validate native toolchain platform selection
        run: ./scripts/test-toolchain-platform-contract.sh
      - name: Validate contained OpenSymphony launcher
        run: ./scripts/test-opensymphony-container.sh
      - name: Bootstrap pinned vcpkg
        run: ./scripts/bootstrap-vcpkg.sh
      - name: Configure, build, and test Debug
        run: cmake --workflow --preset gcc-debug
      - name: Configure, build, and test Release
        run: cmake --workflow --preset gcc-release
      - name: Configure, build, and test ASan and UBSan
        run: cmake --workflow --preset gcc-sanitizers
      - name: Configure, build, and test TSan
        run: cmake --workflow --preset gcc-tsan
      - name: Report compiler cache
        if: ${{ always() }}
        run: ccache --show-stats

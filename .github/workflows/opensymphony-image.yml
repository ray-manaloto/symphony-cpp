name: OpenSymphony orchestrator image

on:
  workflow_dispatch:
  push:
    branches: ["codex/implementation"]
    paths:
      - .github/workflows/opensymphony-image.yml
      - containers/OpenSymphony.Containerfile

permissions:
  contents: read
  packages: write

concurrency:
  group: opensymphony-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Build, smoke-test, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reclaim ephemeral runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Sign in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned OpenSymphony image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: containers/OpenSymphony.Containerfile
          target: symphony-orchestrator
          platforms: linux/amd64
          load: true
          push: false
          tags: symphony-orchestrator:ci
          cache-from: type=gha,scope=symphony-orchestrator
          cache-to: type=gha,mode=max,scope=symphony-orchestrator
      - name: Smoke-test pinned tools
        run: |
          docker run --rm --entrypoint opensymphony symphony-orchestrator:ci --help | grep -F "OpenSymphony local MVP"
          test "$(docker run --rm --entrypoint codex symphony-orchestrator:ci --version)" = "codex-cli 0.145.0"
      - name: Publish tested image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/symphony-orchestrator"
          docker tag symphony-orchestrator:ci "${image}:${GITHUB_SHA}"
          docker tag symphony-orchestrator:ci "${image}:edge"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:edge"

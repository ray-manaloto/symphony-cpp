minimum_pre_commit_version: 4.6.0
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: symphony-fast-preflight
        name: symphony fast preflight
        entry: ./scripts/check-local-preflight.sh quick
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: symphony-push-route
        name: symphony push route
        entry: node scripts/check-push-route.mjs pre-push
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
